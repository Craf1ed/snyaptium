<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snyaptium - Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: #000000;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.auth-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  padding: 20px;
}

.auth-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 50px 40px;
  backdrop-filter: blur(10px);
}

.logo {
  font-size: 2.5em;
  font-weight: 300;
  text-align: center;
  margin-bottom: 40px;
  letter-spacing: -1px;
}

.auth-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 5px;
}

.auth-tab {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  border-radius: 8px;
  font-size: 0.95em;
  font-weight: 500;
  transition: all 0.3s ease;
}

.auth-tab.active {
  background: #ffffff;
  color: #000000;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 0.9em;
  color: rgba(255,255,255,0.8);
  margin-bottom: 8px;
  font-weight: 500;
}

.form-group input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: #ffffff;
  font-size: 0.95em;
  transition: all 0.3s ease;
}

.form-group input:focus {
  outline: none;
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08);
}

.form-group input::placeholder {
  color: rgba(255,255,255,0.4);
}

.submit-btn {
  width: 100%;
  padding: 16px;
  background: #ffffff;
  color: #000000;
  border: none;
  border-radius: 8px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 10px;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(255,255,255,0.3);
}

.submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.error-message {
  background: rgba(255,100,100,0.1);
  border: 1px solid rgba(255,100,100,0.3);
  color: #ff6b6b;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 0.9em;
  display: none;
}

.error-message.show {
  display: block;
  animation: shake 0.5s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.form-container {
  display: none;
}

.form-container.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.footer-text {
  text-align: center;
  margin-top: 30px;
  font-size: 0.85em;
  color: rgba(255,255,255,0.5);
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="auth-container">
  <div class="auth-card">
    <div class="logo">Snyaptium</div>
    
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
    </div>
    
    <div id="errorMessage" class="error-message"></div>
    
    <!-- Login Form -->
    <div id="loginForm" class="form-container active">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="submit-btn" id="loginBtn">Sign In</button>
      </form>
    </div>
    
    <!-- Signup Form -->
    <div id="signupForm" class="form-container">
      <form onsubmit="handleSignup(event)">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="signupName" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Create a password" required minlength="6">
        </div>
        <button type="submit" class="submit-btn" id="signupBtn">Create Account</button>
      </form>
    </div>
    
    <div class="footer-text">
      By continuing, you agree to Snyaptium's Terms & Privacy Policy
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

// Fetch Firebase config from Netlify function
const res = await fetch('/.netlify/functions/get-firebase');
if (!res.ok) throw new Error('Failed to fetch Firebase config');
const data = await res.json(); // { firebaseConfig: { ... } }

const app = initializeApp(data.firebaseConfig); // use data.firebaseConfig, not data
const auth = getAuth(app);
const db = getFirestore(app);

// Redirect if already logged in
auth.onAuthStateChanged((user) => {
  if (user) window.location.href = 'chat.html';
});

window.switchTab = function(tab) {
  const tabs = document.querySelectorAll('.auth-tab');
  const forms = document.querySelectorAll('.form-container');
  tabs.forEach(t => t.classList.remove('active'));
  forms.forEach(f => f.classList.remove('active'));
  
  if (tab === 'login') {
    tabs[0].classList.add('active');
    document.getElementById('loginForm').classList.add('active');
  } else {
    tabs[1].classList.add('active');
    document.getElementById('signupForm').classList.add('active');
  }
  hideError();
}

function showError(message) {
  const errorDiv = document.getElementById('errorMessage');
  errorDiv.textContent = message;
  errorDiv.classList.add('show');
}

function hideError() {
  document.getElementById('errorMessage').classList.remove('show');
}

window.handleLogin = async function(e) {
  e.preventDefault();
  hideError();
  
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  
  btn.disabled = true; btn.textContent = 'Signing in...';
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = 'chat.html';
  } catch (error) {
    let msg = 'Failed to sign in. Please try again.';
    if (error.code === 'auth/user-not-found') msg = 'No account found with this email.';
    else if (error.code === 'auth/wrong-password') msg = 'Incorrect password.';
    else if (error.code === 'auth/invalid-email') msg = 'Invalid email address.';
    showError(msg);
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

window.handleSignup = async function(e) {
  e.preventDefault();
  hideError();
  
  const name = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;
  const btn = document.getElementById('signupBtn');
  
  btn.disabled = true; btn.textContent = 'Creating account...';
  
  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    await updateProfile(user, { displayName: name });
    await setDoc(doc(db, 'users', user.uid), {
      name, email, createdAt: serverTimestamp()
    });
    
    window.location.href = 'chat.html';
  } catch (error) {
    let msg = 'Failed to create account. Please try again.';
    if (error.code === 'auth/email-already-in-use') msg = 'This email is already registered.';
    else if (error.code === 'auth/invalid-email') msg = 'Invalid email address.';
    else if (error.code === 'auth/weak-password') msg = 'Password should be at least 6 characters.';
    showError(msg);
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}
</script>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
  constructor(){
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.size = Math.random()*2+0.5;
    this.speedX = (Math.random()-0.5)*0.5;
    this.speedY = (Math.random()-0.5)*0.5;
    this.opacity = Math.random()*0.3+0.1;
  }
  update(){
    this.x += this.speedX;
    this.y += this.speedY;
    if(this.x>canvas.width) this.x=0;
    if(this.x<0) this.x=canvas.width;
    if(this.y>canvas.height) this.y=0;
    if(this.y<0) this.y=canvas.height;
  }
  draw(){
    ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

const particlesArray = [];
for(let i=0;i<100;i++){ particlesArray.push(new Particle()); }

function connectParticles() {
  for(let i=0; i<particlesArray.length; i++) {
    for(let j=i+1; j<particlesArray.length; j++) {
      const dx = particlesArray[i].x - particlesArray[j].x;
      const dy = particlesArray[i].y - particlesArray[j].y;
      const distance = Math.sqrt(dx*dx + dy*dy);
      
      if(distance < 120) {
        ctx.strokeStyle = `rgba(255,255,255,${0.05 - distance/2400})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
        ctx.stroke();
      }
    }
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particlesArray.forEach(p=>{p.update();p.draw();});
  connectParticles();
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', ()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
