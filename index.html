<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snyaptium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="logo.png" type="image/x-icon">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }

    body {
        min-height:100vh;
        background: #000000;
        overflow-x:hidden;
        color:#ffffff;
        position: relative;
    }

    canvas#bgCanvas {
        position: absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        z-index:0;
    }

    header {
        text-align:center;
        padding:120px 20px 50px;
        position: relative;
        z-index:1;
    }

    header h1 {
        font-size:5em;
        margin-bottom:20px;
        color: #ffffff;
        font-weight: 300;
        letter-spacing: -2px;
        animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    header p {
        font-size:1.2em;
        color:#ffffff;
        max-width:700px;
        margin:0 auto 50px;
        font-weight: 300;
        line-height: 1.8;
        opacity: 0.8;
    }

    .start-btn {
        display:inline-block;
        padding:20px 50px;
        font-size:1.2em;
        background: #ffffff;
        color:#000000;
        border:none;
        border-radius:0;
        cursor:pointer;
        text-decoration:none;
        transition: all 0.3s ease;
        font-weight: 600;
        letter-spacing: 1px;
        position: relative;
        overflow: hidden;
    }

    .start-btn::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.1);
        transition: left 0.3s ease;
    }

    .start-btn:hover::after {
        left: 100%;
    }

    .start-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(255,255,255,0.3);
    }

    .floating-text-container {
        position: relative;
        z-index: 1;
        padding: 80px 20px;
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 60px;
    }

    .floating-text {
        color: #ffffff;
        opacity: 0;
        animation: slideUp 0.8s ease-out forwards;
        padding: 40px;
        border: 1px solid rgba(255,255,255,0.1);
        transition: all 0.3s ease;
    }

    .floating-text:nth-child(1) { animation-delay: 0.1s; }
    .floating-text:nth-child(2) { animation-delay: 0.2s; }
    .floating-text:nth-child(3) { animation-delay: 0.3s; }
    .floating-text:nth-child(4) { animation-delay: 0.4s; }
    .floating-text:nth-child(5) { animation-delay: 0.5s; }

    .floating-text:hover {
        border-color: rgba(255,255,255,0.4);
        transform: translateY(-5px);
        background: rgba(255,255,255,0.02);
    }

    .floating-text h3 {
        font-size: 1.5em;
        margin-bottom: 15px;
        font-weight: 600;
        letter-spacing: -0.5px;
    }

    .floating-text p {
        font-size: 0.95em;
        line-height: 1.7;
        color: rgba(255,255,255,0.7);
        font-weight: 300;
    }

    @keyframes slideUp {
        from { 
            opacity: 0;
            transform: translateY(30px);
        }
        to { 
            opacity: 1;
            transform: translateY(0);
        }
    }

    footer {
        text-align:center;
        padding:60px 20px;
        font-size:0.9em;
        color:rgba(255,255,255,0.5);
        position: relative;
        z-index:1;
        font-weight: 300;
    }

    .grid-line {
        position: absolute;
        background: rgba(255,255,255,0.03);
    }

    .grid-line.vertical {
        width: 1px;
        height: 100%;
        top: 0;
    }

    .grid-line.horizontal {
        height: 1px;
        width: 100%;
        left: 0;
    }
</style>

<script src="status.js"></script>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header>
    <h1>Snyaptium</h1>
    <p>Your intelligent AI companion for creativity, learning, and exploration. Unleash the power of smart tools and endless possibilities with a single click.</p>
    <a href="chat.html" class="start-btn">START NOW</a>
</header>

<div class="floating-text-container" id="textContainer"></div>

<footer>
    &copy; 2025 Snyaptium. All rights reserved.
</footer>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
    constructor(){
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.size = Math.random()*2+0.5;
        this.speedX = (Math.random()-0.5)*0.5;
        this.speedY = (Math.random()-0.5)*0.5;
        this.opacity = Math.random()*0.3+0.1;
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x>canvas.width) this.x=0;
        if(this.x<0) this.x=canvas.width;
        if(this.y>canvas.height) this.y=0;
        if(this.y<0) this.y=canvas.height;
    }
    draw(){
        ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

const particlesArray = [];
for(let i=0;i<150;i++){ particlesArray.push(new Particle()); }

function connectParticles() {
    for(let i=0; i<particlesArray.length; i++) {
        for(let j=i+1; j<particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            if(distance < 120) {
                ctx.strokeStyle = `rgba(255,255,255,${0.05 - distance/2400})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                ctx.stroke();
            }
        }
    }
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particlesArray.forEach(p=>{p.update();p.draw();});
    connectParticles();
    requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// Content cards
const textData = [
    { title: "AI Chat", desc: "Engage in real-time conversations with Snyaptium, your AI companion designed to answer questions, brainstorm ideas, and provide assistance instantly." },
    { title: "Smart Tools", desc: "Access a suite of AI-powered utilities including text generation, summaries, creative writing, and analytical tools to boost productivity." },
    { title: "Explore & Learn", desc: "Discover new topics, learn new skills, and dive deep into knowledge with guidance from your AI, tailored to your personal pace and interests." },
    { title: "Community & Collaboration", desc: "Connect with other users, share insights, and collaborate on creative projects using AI-driven suggestions and smart workflows." },
    { title: "Safe & Private", desc: "Your data stays secure. Snyaptium prioritizes privacy, ensuring that your conversations and creations are protected at all times." }
];

const container = document.getElementById('textContainer');

textData.forEach((item) => {
    const div = document.createElement('div');
    div.className = 'floating-text';
    div.innerHTML = `<h3>${item.title}</h3><p>${item.desc}</p>`;
    container.appendChild(div);
});

// Subtle grid lines
function createGridLines() {
    const spacing = 100;
    
    for(let i = 0; i < window.innerWidth; i += spacing) {
        const line = document.createElement('div');
        line.className = 'grid-line vertical';
        line.style.left = i + 'px';
        document.body.appendChild(line);
    }
    
    for(let i = 0; i < window.innerHeight; i += spacing) {
        const line = document.createElement('div');
        line.className = 'grid-line horizontal';
        line.style.top = i + 'px';
        document.body.appendChild(line);
    }
}

createGridLines();
</script>

</body>
</html>
